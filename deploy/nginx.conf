# nginx site for Paradisia, on the same VPS as the Minecraft server.
#
# - serves the files of the site from /var/www/paradisia
# - forwards /api/ to the nh_api mod (listening on 127.0.0.1:8091) and adds the secret key,
#   so the key stays on the server and never reaches the browser.
#
# Install: copy to /etc/nginx/sites-available/paradisia, replace the two values below,
# link it into sites-enabled, then `nginx -t && systemctl reload nginx`.
# For HTTPS, run `certbot --nginx -d <your domain>` once the domain points to the VPS.

server {
    listen 80;
    server_name paradisia.example.com;   # <- your domain

    root /var/www/paradisia;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Api-Key "REPLACE_WITH_THE_TOKEN";   # <- token from config/nh_api.toml
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
