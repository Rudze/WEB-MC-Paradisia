name: Pages

# Every 5 minutes (and on every push to main), downloads the players' data from the Minecraft
# server's API into data/, then publishes the site with it on GitHub Pages.
# GitHub may start scheduled runs a few minutes late.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, the newest one wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the players' data
        run: python3 scripts/fetch_data.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
